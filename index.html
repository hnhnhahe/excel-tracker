<!doctype html>

<head>

<title>Production_Schedule_2026_V1.A1.38.xlsx</title>
<style>
  /* Spreadsheet-style shell: title bar, menu tabs, ribbon, formula bar, cell grid, sheet tabs, status bar. */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #ffffff;
    color: #1f1f1f;
    font-family: Calibri, "Segoe UI", Arial, Helvetica, sans-serif;
    font-size: 13px;
    color-scheme: light;
  }
  .app { height: 100%; display: flex; flex-direction: column; min-width: 0; }

  .titlebar { background: #217346; color: #fff; display: flex; align-items: center; gap: 12px; padding: 6px 12px; min-height: 32px; }
  .titlebar .fname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titlebar .saved { opacity: .8; font-size: 12px; }

  .menu { background: #217346; display: flex; overflow-x: auto; white-space: nowrap; padding: 0 8px; }
  .menu span { color: #e8f3ec; padding: 6px 12px; font-size: 13px; cursor: default; }
  .menu span.on { background: #f3f3f3; color: #217346; font-weight: 600; border-radius: 4px 4px 0 0; }

  .ribbon { background: #f3f3f3; border-bottom: 1px solid #d4d4d4; padding: 6px 10px; display: flex; align-items: center; gap: 8px; overflow-x: auto; white-space: nowrap; min-height: 46px; }
  .ribbon button {
    font: inherit; color: #1f1f1f; background: #fff; border: 1px solid #c8c8c8; border-radius: 3px;
    padding: 5px 10px; cursor: pointer; min-height: 32px;
  }
  .ribbon button:hover { background: #e9f3ed; border-color: #217346; }
  .ribbon button:focus-visible { outline: 2px solid #217346; outline-offset: 1px; }
  .ribbon .sep { width: 1px; align-self: stretch; background: #d4d4d4; margin: 2px 4px; }
  .ribbon .lbl { color: #555; font-variant-numeric: tabular-nums; min-width: 8ch; text-align: center; }

  .fbar { display: flex; align-items: stretch; border-bottom: 1px solid #d4d4d4; background: #fff; min-height: 26px; }
  .namebox { width: 72px; flex: none; border-right: 1px solid #d4d4d4; padding: 4px 8px; text-align: center; font-variant-numeric: tabular-nums; }
  .fx { width: 36px; flex: none; text-align: center; color: #777; font-style: italic; padding: 4px 0; border-right: 1px solid #d4d4d4; }
  .fval { flex: 1; min-width: 0; padding: 4px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .gridwrap { flex: 1; min-height: 0; overflow: auto; background: #fff; }
  table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
  th, td { height: 22px; padding: 0 6px; border-right: 1px solid #e1e1e1; border-bottom: 1px solid #e1e1e1; white-space: nowrap; font-weight: 400; }
  thead th { position: sticky; top: 0; z-index: 3; background: #e6e6e6; color: #444; text-align: center; min-width: 60px; border-color: #c8c8c8; font-size: 12px; }
  th.corner { left: 0; z-index: 4; min-width: 40px; width: 40px; }
  th.rn { position: sticky; left: 0; z-index: 2; background: #e6e6e6; color: #444; text-align: center; min-width: 40px; width: 40px; font-size: 12px; border-color: #c8c8c8; }
  td.r { text-align: right; }
  td.num { text-align: right; min-width: 56px; }
  td.team { min-width: 190px; }
  td.stat { min-width: 140px; }
  td.venue { min-width: 220px; }
  td.play { min-width: 460px; }
  td.name { min-width: 170px; }
  td.filt { cursor: pointer; background: #fff4d6; color: #7a5200; font-weight: 700; white-space: nowrap; }
  td.filt:hover { background: #ffe39a; }
  td.vt { vertical-align: top; }
  td.wcell, td.xcell, td.acell { text-align: center; cursor: pointer; user-select: none; }
  td.wcell { color: #c58a00; }
  td.xcell { color: #b3261e; }
  td.acell { color: #217346; font-weight: 700; }
  td.xcell:hover, td.acell:hover, td.wcell:hover { background: #fff4d6; }
  #catPanel { position: fixed; top: 150px; left: 24px; z-index: 50; width: 330px; max-height: 70vh; overflow: auto; background: #fff; color: #222; border: 1px solid #9bbfa9; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 13px; }
  #catPanel .ph { background: #217346; color: #fff; padding: 8px 12px; font-weight: 700; }
  #catPanel .pb { padding: 8px 12px; }
  #catPanel .grp { font-weight: 700; margin: 8px 0 4px; color: #217346; }
  #catPanel label { display: inline-block; width: 31%; padding: 2px 0; cursor: pointer; }
  #yhPanel { position: fixed; top: 120px; left: 50%; transform: translateX(-50%); z-index: 60; width: min(560px, 94vw); max-height: 78vh; overflow: auto; background: #fff; color: #222; border: 1px solid #9bbfa9; box-shadow: 0 8px 28px rgba(0,0,0,.3); font-size: 13px; }
  #yhPanel .ph { background: #217346; color: #fff; padding: 8px 12px; font-weight: 700; }
  #yhPanel .pb { padding: 10px 12px; }
  #yhPanel textarea { width: 100%; height: 130px; box-sizing: border-box; font: 12px Consolas, monospace; }
  #yhPanel .row { margin: 6px 0; }
  #yhPanel label.pl { display: block; padding: 2px 0; cursor: pointer; }
  #yhPanel .warn { color: #8a5a00; }
  #catPanel .pbtn { margin: 4px 4px 0 0; }
  .cap { max-height: 144px; overflow: hidden; }
  td.wrapc { white-space: normal; word-break: break-word; line-height: 1.35; }
  td.wh { min-width: 340px; max-width: 340px; }
  td.wd { min-width: 560px; max-width: 560px; }
  td.clip { max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.fresh { color: #b3261e; font-weight: 700; text-align: center; }
  td.hdr { font-weight: 700; background: #f0f6f2; border-bottom: 1px solid #9bbfa9; }
  td.sortable { cursor: pointer; user-select: none; -webkit-user-select: none; }
  td.sortable:hover { background: #dcebe2; }
  td.sec { font-weight: 700; background: #f7f7f7; color: #444; }
  td.court { background: #d6f0dc; }
  tr.clk:hover td.court { background: #d6f0dc; }
  td.mine { color: #1a56a0; font-weight: 700; }
  td.bold { font-weight: 700; }
  td.dim { color: #8a8a8a; }
  td.live { background: #fde7e9; color: #b00020; font-weight: 700; }
  td.hl { background: #fff4c2; font-weight: 600; }
  td.pm { background: #d6e6fa; font-weight: 700; }
  td.pw { background: #eadcf7; font-weight: 700; }
  td.watch { color: #7b3fa0; font-weight: 700; }
  td.note { color: #666; font-size: 12px; white-space: normal; height: auto; padding: 6px; }
  td.wrap { white-space: normal; min-width: 420px; height: auto; padding: 4px 6px; }
  td[data-gid], td[data-gb] { cursor: pointer; }
  td[data-gid]:hover, td[data-gb]:hover { text-decoration: underline; }
  td.sel { outline: 2px solid #217346; outline-offset: -2px; }
  tr.clk { cursor: pointer; }
  tr.clk:hover td { background: #f1f8f4; }
  tr.clk:hover td.live { background: #fde7e9; }

  .tabsbar { display: flex; align-items: stretch; background: #f3f3f3; border-top: 1px solid #d4d4d4; overflow-x: auto; white-space: nowrap; min-height: 30px; }
  .tabsbar button {
    font: inherit; border: 0; border-right: 1px solid #d4d4d4; background: #f3f3f3; color: #333; padding: 0 16px; cursor: pointer; min-height: 30px;
  }
  .tabsbar button.on { background: #fff; color: #217346; font-weight: 700; box-shadow: inset 0 -2px 0 #217346; }
  .tabsbar button:focus-visible { outline: 2px solid #217346; outline-offset: -2px; }
  .tabsbar .plus { color: #777; padding: 0 12px; display: flex; align-items: center; }

  .statusbar {
    background: #f3f3f3; border-top: 1px solid #d4d4d4; color: #444; font-size: 12px;
    display: flex; justify-content: space-between; gap: 12px; padding: 4px 12px;
    padding-bottom: max(4px, env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .statusbar span { font-variant-numeric: tabular-nums; }

  /* Player picker controls */
  .ribbon select, .ribbon input[type="text"] { font: inherit; font-size: 14px; color: #1f1f1f; background: #fff; border: 1px solid #c8c8c8; border-radius: 3px; padding: 4px 8px; min-height: 32px; }
  .ribbon input[type="text"] { width: 150px; }
  .ribbon select { max-width: 220px; }
  .ribbon select:focus-visible, .ribbon input[type="text"]:focus-visible { outline: 2px solid #217346; outline-offset: 1px; }
  td.picked { background: #dde9fb; }
  tr.clk:hover td.picked { background: #cfe0f7; }
  td.tick { color: #1a56a0; font-weight: 700; text-align: center; min-width: 40px; }
  tr.pk td.tick, tr.pk td.name { cursor: pointer; }
  tr.pk td.tick:hover, tr.pk td.name:hover { background: #f1f8f4; }
  tr.pk td.picked:hover { background: #cfe0f7; }

  /* Phone layout (screens narrower than 700 px). Computers are not affected. */
  * { -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  @media (max-width: 700px) {
    .app { height: 100vh; height: 100dvh; }
    .menu, .titlebar .saved, .fbar .fx { display: none; }
    .titlebar { padding: 4px 10px; min-height: 28px; font-size: 12px; }
    .ribbon { padding: 6px 8px; gap: 6px; min-height: 52px; -webkit-overflow-scrolling: touch; }
    .ribbon button, .ribbon select, .ribbon input { min-height: 38px; font-size: 15px; touch-action: manipulation; }
    .ribbon input[type="text"], .ribbon input[type="number"], .ribbon select { font-size: 16px; }
    .namebox { width: 54px; padding: 4px 4px; }
    th.corner, th.rn { min-width: 30px; width: 30px; }
    th, td { height: 30px; padding: 0 8px; }
    td, th { font-size: 14px; }
    td.name { min-width: 130px; }
    td.team { min-width: 150px; }
    td.play { min-width: 260px; }
    td.wh { min-width: 240px; max-width: 240px; }
    td.wd { min-width: 300px; max-width: 300px; }
    .tabsbar button { padding: 0 16px; min-height: 40px; touch-action: manipulation; }
    .statusbar #statusRight { display: none; }
    .gridwrap { -webkit-overflow-scrolling: touch; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar"><span class="fname" id="fname">Production_Schedule_2026_V1.A1.38.xlsx</span><span class="saved">Saved</span></div>
  <div class="menu"><span>File</span><span class="on">Home</span><span>Insert</span><span>Page Layout</span><span>Formulas</span><span>Data</span><span>Review</span><span>View</span></div>

  <div class="ribbon">
    <span id="gListCtl" style="display:contents">
      <button id="prev" type="button" aria-label="Previous day">&#9664; Prev</button>
      <span class="lbl" id="dateLabel">—</span>
      <button id="next" type="button" aria-label="Next day">Next &#9654;</button>
      <button id="today" type="button">Today</button>
    </span>
    <span id="gDetailCtl" style="display:none">
      <button id="back" type="button">&#9664; Back</button>
      <select id="gameSel" aria-label="Game" style="max-width:300px"></select>
      <button id="filterBtn" type="button" hidden>Filter: All</button>
    </span>
    <span id="gPickCtl" style="display:none">
      <select id="pickSeason" aria-label="Season"></select>
      <select id="pickView" aria-label="View"><option value="avg">Per game</option><option value="tot">Total</option></select>
      <select id="teamSel" aria-label="Filter by team"><option value="all">All teams</option></select>
      <input id="playerSearch" type="text" placeholder="Search player" autocomplete="off" aria-label="Search player">
      <select id="fCol" aria-label="Filter column"></select>
      <select id="fOp" aria-label="Operator"><option value="&gt;">&gt;</option><option value="&gt;=">&gt;=</option><option value="&lt;">&lt;</option><option value="&lt;=">&lt;=</option><option value="=">=</option></select>
      <input id="fVal" type="number" step="any" placeholder="Value" aria-label="Filter value" style="width:70px">
      <button id="fAdd" type="button">Add filter</button>
      <button id="fClear" type="button">Clear filters</button>
      <button id="selOnlyBtn" type="button">Selected only: Off</button>
      <button id="watchOnlyBtn" type="button">Watching only: Off</button>
      <button id="reloadBtn" type="button">Reload list</button>
    </span>
    <span id="gNewsCtl" style="display:none">
      <select id="newsType" aria-label="News type"><option value="ns">Notes + stories</option><option value="n">Player notes only</option><option value="all">All incl. video</option></select>
      <select id="newsScope" aria-label="Scope"><option value="mine">My players</option><option value="league">League-wide</option><option value="search">Search result</option></select>
      <select id="newsPlayer" aria-label="Player"></select>
      <input id="newsSearch" type="text" placeholder="Search any player, press Enter" autocomplete="off" aria-label="Search any player" style="width:210px">
      <button id="newsWrapBtn" type="button">Wrap text: On</button>
      <button id="newsTrBtn" type="button">Translate: Off</button>
      <select id="newsTrEng" aria-label="Translation engine"><option value="g">Engine: Google web</option><option value="c">Engine: Chrome built-in</option></select>
    </span>
    <span id="gInjCtl" style="display:none">
      <select id="injScope" aria-label="Scope"><option value="mw">My Players + Watchlist</option><option value="mine">My Players</option><option value="watch">Watchlist</option><option value="league">League-wide</option></select>
      <select id="injStatus" aria-label="Status"><option value="all">All statuses</option><option value="out">Out only</option><option value="other">Day-to-day and others</option></select>
    </span>
    <span id="gStatCtl" style="display:none">
      <select id="statMode" aria-label="Range"></select>
      <select id="statView" aria-label="View"><option value="avg">Per game</option><option value="tot">Total</option></select>
    </span>
    <span id="gMineCtl" style="display:none">
      <span class="sep"></span>
      <button id="watchModeBtn" type="button">Watchlist: Season</button>
      <button id="yhBtn" type="button">Paste from Yahoo</button>
      <button id="catBtn" type="button">Categories</button>
      <button id="pickBtn" type="button">Pick players</button>
      <button id="exportBtn" type="button">Export</button>
      <button id="importBtn" type="button">Import</button>
    </span>
    <span class="sep"></span>
    <button id="refreshBtn" type="button">Refresh All</button>
    <button id="toMineBtn" type="button" hidden>My Players</button>
    <button id="toBoxBtn" type="button" hidden>Box Score</button>
    <button id="toPbpBtn" type="button" hidden>Play-by-Play</button>
    <span class="sep"></span>
    <button id="zoomOut" type="button" title="Smaller">A−</button><span class="lbl" id="zoomLbl" style="min-width:5ch">100%</span><button id="zoomIn" type="button" title="Larger">A+</button>
    <input id="importFile" type="file" accept=".json,.txt,application/json,text/plain" hidden>
  </div>

  <div class="fbar">
    <div class="namebox" id="nameBox">A1</div>
    <div class="fx">fx</div>
    <div class="fval" id="fVal"></div>
  </div>

  <div class="gridwrap" id="gridwrap" aria-live="polite"></div>

  <div class="tabsbar" id="tabsbar"></div>
  <div class="statusbar"><span id="statusLeft">Ready</span><span id="statusRight">Loading…</span></div>
</div>

<script>
(function () {
  var VERSION = "V1.A1.38";
  var CHANGELOG = [
    { v: "V1.A1.38", d: "2026-10-24", n: "Zoom. New A− and A+ buttons at the end of the toolbar make the table smaller or larger (60%, 70%, 80%, 100%, 120%, 150%) on both phone and desktop. The size is remembered and is included in Export and Import." },
    { v: "V1.A1.37", d: "2026-10-24", n: "Phone layout. On screens narrower than 700 px the fake menu bar is hidden, buttons, drop-downs and cells are bigger for fingers, input boxes no longer make the page zoom, only the player name column stays frozen (My and Player in Player List), and the page uses the real screen height. Because phones have no double-click, double-tap now does what double-click does (add or remove a player in Box Score, open an article in News or My Players). Rotating the phone redraws the sheet. On a computer nothing changes." },
    { v: "V1.A1.36", d: "2026-10-22", n: "Player List now has an Injury column after Chg% (same text as My Players, for example Out · Foot – Fracture (Left) · return 2026-11-20). Click the column title to sort: most serious first (Out for season, Out, then day-to-day), then a second click for the reverse. Out players are shown in bold." },
    { v: "V1.A1.35", d: "2026-10-22", n: "Injuries. New Injuries sheet (after News) from the ESPN injury list: status, injury and side, expected return date, last update and the full note. Scope: My Players + Watchlist, My Players, Watchlist or League-wide, plus a status filter. My Players and the Watchlist have a new Injury column after Chg% (for example Out · Foot – Fracture (Left) · return 2026-11-20). My Players are shown in blue and Watchlist players in purple. Data is loaded when you open My Players or Injuries or click Refresh All and kept for 10 minutes." },
    { v: "V1.A1.34", d: "2026-10-22", n: "Removed the last visible mentions of the league abbreviation from the Changelog and from one error message. No other change." },
    { v: "V1.A1.33", d: "2026-10-22", n: "The Box Score sheet now has a Play-by-Play button in the top bar (after My Players), so you can switch between the two without using the tabs at the bottom. The Play-by-Play sheet has the matching Box Score button." },
    { v: "V1.A1.32", d: "2026-10-22", n: "Play-by-Play now has a Box Score button right after My Players (it only shows on the Play-by-Play sheet). In My Players and the Watchlist (Today view), click a Team cell to open that game's Box Score; clicking a Game cell still opens its Play-by-Play." },
    { v: "V1.A1.31", d: "2026-10-22", n: "The Back button works as before (it returns to Sheet1). While a game is open there is a new My Players button right after Refresh All that takes you to the My Players sheet; the game tabs stay open so you can come back to it." },
    { v: "V1.A1.30", d: "2026-10-21", n: "In My Players, click a Game cell (for example vs ATL 31.1 - 1st) to jump straight to that game's Play-by-Play. The same works for the Game cell in the Watchlist (Today view). The Back button then returns to My Players. Game cells are underlined when you point at them." },
    { v: "V1.A1.29", d: "2026-10-21", n: "Automatic date change. Sheet1 and My Players now follow ESPN's current game day on every refresh, so a tab left open moves to the next day by itself. Once you press Prev or Next the date stays on the day you picked; press Today to follow ESPN's current day again." },
    { v: "V1.A1.28", d: "2026-10-21", n: "Fixed the date label on Sheet1 and My Players: when ESPN returns no data for the day you picked with Next or Prev (for example a day without games), the label now shows the date you picked instead of staying on the old date." },
    { v: "V1.A1.27", d: "2026-10-21", n: "My Players now shows the Team and Game columns for players who have no stat line yet (game not started, no game that day, or waiting for data), the same way the Watchlist does, for example Not started Oct 22, 8:00 AM or No game." },
    { v: "V1.A1.26", d: "2026-10-21", n: "News archive. Every news item the program loads is now saved in this browser for 30 days (up to 3000 items), so older news no longer disappears when ESPN pushes it out of its latest 50. The News sheet shows the archive together with the newest items for the chosen scope (My players, League-wide or a searched player), and its title row shows how many items are archived. Export now includes the archive and Import merges it without duplicates. The archive only grows while the program is open, so open the News sheet at least once a day." },
    { v: "V1.A1.25", d: "2026-10-21", n: "New Own% (roster percentage) and Chg% (change since the previous day, the add/drop trend) columns in Player List, My Players and the Watchlist. The numbers come from ESPN fantasy, so they describe ESPN leagues, not your Yahoo league. They are loaded when you open those sheets or click Refresh All, kept for 30 minutes, and every column can be sorted." },
    { v: "V1.A1.24", d: "2026-10-21", n: "Box Score has a star column right after the player name. Click the star to add or remove that player in the Watchlist (a filled star means he is watched). Double-click on the name still adds or removes a player in My Players." },
    { v: "V1.A1.23", d: "2026-10-21", n: "Play-by-Play now marks plays by your players. A new last column, Note, shows MY: name for a My Players player and WATCH: name for a Watchlist player, and shades the Play and Note cells blue (My Players) or purple (Watchlist). The Filter button now cycles All, Scoring, Mine and Watch (only plays that involve your players or watched players). Box Score shows watched players in purple." },
    { v: "V1.A1.22", d: "2026-10-21", n: "Watchlist: new Season / Today button on My Players. Today shows each watched player's live or final stat line from today's games in the same category columns, with green shading while he is on the court (not counted in the Total row). The setting is remembered. My Players now also has GP, Next 7, Wk left and Latest news columns (the Total row adds up Next 7 and Wk left), and an x to remove a player. Latest news wraps instead of being cut off." },
    { v: "V1.A1.21", d: "2026-10-21", n: "The Watchlist now sits at the bottom of the My Players sheet, two blank rows under the Total row, using the same category columns, so you compare your players and your targets on one page. The separate Watchlist tab is gone. Player List: the Sel column is renamed My, and the star column now follows the player name." },
    { v: "V1.A1.20", d: "2026-10-21", n: "New Watchlist sheet for players you are watching (pickup candidates). In Player List click the star column to add or remove a player (Watching only button filters the list). The Watchlist shows each player's team, next game, games in the next 7 days and left this Mon-Sun week, season per-game stats in your chosen categories, and the latest news headline. Click the plus to add a player to My Players, or the cross to drop him from the Watchlist. The watchlist is saved with Export and Import." },
    { v: "V1.A1.19", d: "2026-10-21", n: "My Players: new Paste from Yahoo button. Open your Yahoo roster page, select and copy the roster table, paste it into the box, and the sheet matches the players (names like C. Cunningham DET), shows a preview you can untick, then replaces or adds to your list. Takes a few seconds, so you do not have to rebuild the list by hand after pickups and drops." },
    { v: "V1.A1.18", d: "2026-10-21", n: "Your whole working state is now remembered automatically and opens exactly as you left it: the sheet you were on, categories, sort orders, filters, season and view choices, news options and translation. Export now saves the player list together with all of these settings, and Import restores them (old my_players.json files still import fine). Fixed: categories were not part of the backup file." },
    { v: "V1.A1.17", d: "2026-10-21", n: "My Players: new Categories button opens a list of scoring categories (FG%, FT%, 3PTM, 3PT%, PTS, REB, AST, ST, BLK, TO, A/T, DD and more). Tick the ones your league uses and the sheet shows exactly those columns, with a Total row calculated correctly (percentages from made / attempted, A/T from total AST / total TO, DD as a count). Your choice is saved in this browser." },
    { v: "V1.A1.16", d: "2026-10-21", n: "Translation keeps people's names in English: every league player (full name, first name or last name) plus other First Last names such as coaches and reporters are protected before translating and put back afterwards. If a translator drops a protected name, that text is translated in pieces around the names instead." },

  function esc(s) {

  function shiftDate(iso, days) {

  }
  function teamName(t) { return (t && (t.displayName || t.shortDisplayName || t.abbreviation)) || ""; }
  function colLetter(i) { var s = "", n = i + 1; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }

  function numOf(v) { var m = String(v == null ? "" : v).match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; }
  function cmp(a, b, d, isNum) {

  function hdrCell(text, cls, sk, active, dir) {

  /* ---------- Saved player list ---------- */
  function norm(s) {
    var t = String(s || "").toLowerCase();
    try { t = t.normalize("NFD").replace(/[̀-ͯ]/g, ""); } catch (e) {}

  function loadRoster() {

    } catch (e) { return []; }
  }

  }
  function rosterIndex(name, id) {
    for (var i = 0; i < roster.length; i++) {

  }
  function athleteIndex(ath) { return ath ? rosterIndex(ath.displayName || ath.shortName || "", ath.id) : -1; }

  /* ---------- Grid renderer ---------- */
  // rows: [{ c: [{ t, cls, span, html, sk, pid, pn }], id }]
  function gridHtml(rows) {
    var n = 12, i;
    rows.forEach(function (r) { var w = 0; r.c.forEach(function (x) { w += x.span || 1; }); if (w > n) n = w; });
    var out = '<table><thead><tr><th class="corner"></th>';
    for (i = 0; i < n; i++) out += "<th>" + colLetter(i) + "</th>";
    out += "</tr></thead><tbody>";
    var total = Math.max(rows.length, 45);
    for (var r = 0; r < total; r++) {
      var row = rows[r] || { c: [] };
      out += "<tr" + (row.id ? ' data-id="' + esc(row.id) + '" class="clk"' : (row.pk ? ' data-pk="' + esc(row.pk) + '" class="pk"' : "")) + '><th class="rn">' + (r + 1) + "</th>";
      var w = 0;
      row.c.forEach(function (x) {
        var span = x.span || 1;
        out += "<td" + (span > 1 ? ' colspan="' + span + '"' : "") + (x.cls ? ' class="' + x.cls + '"' : "") +
               (x.sk ? ' data-sk="' + esc(x.sk) + '"' : "") + (x.fi != null ? ' data-fi="' + x.fi + '"' : "") + (x.lk ? ' data-lk="' + esc(x.lk) + '"' : "") + (x.gid ? ' data-gid="' + esc(x.gid) + '"' : "") + (x.gb ? ' data-gb="' + esc(x.gb) + '"' : "") +
               (x.pn ? ' data-pid="' + esc(x.pid || "") + '" data-pn="' + esc(x.pn) + '"' : "") + ">" +
               (x.html != null ? x.html : esc(x.t)) + "</td>";
        w += span;
      });
      for (; w < n; w++) out += "<td></td>";
      out += "</tr>";
    }
    return out + "</tbody></table>";
  }

  function tdAt(tr, col) {
    var sum = 0, tds = tr.querySelectorAll("td");
    for (var i = 0; i < tds.length; i++) { var s = tds[i].colSpan || 1; if (col < sum + s) return tds[i]; sum += s; }

  function isNarrow() { return window.innerWidth < 700; }
  function freezePanes(rows) {
    var fc = { pick: 3, watch: 3, stats: 1, mine: 1, sched: 1, news: 2, inj: 1, list: 0 }[sheet];
    if (fc === undefined || eventId) return;
    if (isNarrow()) fc = Math.min(fc, sheet === "pick" ? 2 : 1);
    var hi = -1, i, j;
    for (i = 0; i < rows.length && hi < 0; i++) if (rows[i].c.some(function (c) { return c.cls && /(^| )hdr( |$)/.test(c.cls); })) hi = i;
    var table = wrap.querySelector("table");
    if (hi < 0 || !table || !table.tBodies[0]) return;
    var trs = table.tBodies[0].rows;
    function solid(el) {
      var bg = getComputedStyle(el).backgroundColor;
      el.style.background = (!bg || bg === "transparent" || /rgba\(0, 0, 0, 0\)/.test(bg)) ? "#fff" : bg;
    }
    var lefts = [], acc = 0, hcells = trs[hi].cells;
    for (j = 0; j < hcells.length && j <= fc; j++) { lefts[j] = acc; acc += hcells[j].offsetWidth; }
    var top = table.tHead.offsetHeight;
    for (i = 0; i < trs.length; i++) {
      var cells = trs[i].cells, frozenRow = i <= hi;
      for (j = 0; j < cells.length; j++) {
        var c = cells[j], leftSide = j <= fc && c.colSpan === 1;
        if (!frozenRow && !leftSide) continue;

        c.style.position = "sticky";
        if (frozenRow) c.style.top = top + "px";
        if (leftSide) c.style.left = lefts[j] + "px";
        c.style.zIndex = frozenRow ? (leftSide ? 4 : 2) : 1;
        if (j > 0) solid(c);
      }

    }
  }
  var ZOOMS = [60, 70, 80, 100, 120, 150], zoomPct = 100;

  var LIST_COLS = [
    { k: "status",  t: "Status",   cls: "stat",  num: true },
    { k: "away",    t: "Away",     cls: "team",  num: false },
    { k: "awayPts", t: "Away PTS", cls: "num",   num: true },

  function listRows(events) {
    var items = [];
    events.forEach(function (ev) {
      var comp = ev.competitions && ev.competitions[0];
      if (!comp) return;
      var away = comp.competitors.filter(function (c) { return c.homeAway === "away"; })[0];
      var home = comp.competitors.filter(function (c) { return c.homeAway === "home"; })[0];
      if (!away || !home) return;
      items.push({
        ev: ev, comp: comp, away: away, home: home,
        keys: {
          status: Date.parse(ev.date) || 0,
          away: teamName(away.team), awayPts: parseInt(away.score, 10),
          home: teamName(home.team), homePts: parseInt(home.score, 10),
          venue: comp.venue && comp.venue.fullName ? comp.venue.fullName : ""
        }
      });
    });
    if (sortList.k) {
      var col = LIST_COLS.filter(function (c) { return c.k === sortList.k; })[0];
      items.sort(function (a, b) { return cmp(a.keys[sortList.k], b.keys[sortList.k], sortList.d, col.num); });
    }
    var rows = [{ c: LIST_COLS.map(function (c) { return hdrCell(c.t, "hdr " + c.cls, "list|" + c.k, sortList.k === c.k, sortList.d); }) }];
    items.forEach(function (it) {
      var ev = it.ev, st = (ev.status && ev.status.type) || {};
      var state = st.state, post = state === "post";

                 : state === "post" ? { t: st.shortDetail || "Final", cls: "stat" }
                 : { t: tpeTime.format(new Date(ev.date)), cls: "stat dim" };
      function rec(c) { return c.records && c.records[0] && c.records[0].summary ? " (" + c.records[0].summary + ")" : ""; }
      function sc(c) { return c.score != null && c.score !== "" ? c.score : ""; }
      function tone(c) { return post && c.winner ? " bold" : (post ? " dim" : ""); }
      rows.push({ id: ev.id, c: [
        status,
        { t: teamName(it.away.team) + rec(it.away), cls: "team" + tone(it.away) },
        { t: sc(it.away), cls: "num" + tone(it.away) },
        { t: teamName(it.home.team) + rec(it.home), cls: "team" + tone(it.home) },
        { t: sc(it.home), cls: "num" + tone(it.home) },
        { t: it.keys.venue, cls: "venue dim" }

    });

  function loadList() {

        if (sheet === "list") paint(listRows(lastList));

  /* ---------- Scoring categories (My Players) ---------- */
  var CAT_KEY = "ps_cats_v1";
  var CAT_DEFAULT = ["FG%", "FT%", "3PTM", "3PT%", "PTS", "REB", "AST", "ST", "BLK", "TO", "A/T", "DD"];
  function pctTxt(v) { return isNaN(v) ? "-" : (v >= 1 ? "1.000" : v.toFixed(3).replace(/^0/, "")); }
  function ratio(a, b) { return b ? a / b : NaN; }

  function pct(a, b) { return function (c) { var v = ratio(c[a], c[b]); return { v: v, s: pctTxt(v) }; }; }
  var CATS = [
    { k: "FG%", g: 1, f: pct("FGM", "FGA") }, { k: "FT%", g: 1, f: pct("FTM", "FTA") }, { k: "3PTM", g: 1, f: plain1("TPM") }, { k: "3PT%", g: 1, f: pct("TPM", "TPA") },

    var re = /(?<![\p{L}])((?:\p{Lu}\.){1,3})\s+(\p{Lu}[\p{L}'’-]*(?:\s(?:Jr\.|Sr\.|II|III|IV))?)(?:[ \t]+([A-Z]{2,4}))?(?![\p{L}])/gu, m;
    while ((m = re.exec(text))) {
      var key = initKey(m[1]) + "|" + norm(m[2]);
      var cands = byKey[key] || [];
      if (!cands.length) { unmatched.push((m[1] + " " + m[2] + (m[3] ? " " + m[3] : "")).trim()); continue; }
      var pick = cands;
      if (cands.length > 1) { var byT = cands.filter(function (c) { return teamOk(c.team, m[3]); }); if (byT.length) pick = byT; }
      take(pick[0], pick.length > 1);
      usedSpans.push([m.index, m.index + m[0].length]);
    }
    text.split(/\r?\n/).forEach(function (line) {
      var t = line.trim();
      if (!t || /\p{Lu}\./u.test(t)) return;
      var c = byFull[norm(t)];
      if (c && c.length) take(c[0], c.length > 1);
    });
    return { matched: matched, unmatched: unmatched };
  }
  (function () {
    var panel = document.createElement("div");
    panel.id = "yhPanel"; panel.hidden = true;
    document.body.appendChild(panel);
    var last = null;
    function shell(inner) {
      panel.innerHTML = '<div class="ph">Paste your Yahoo roster</div><div class="pb">' +
        '<div class="row">On your Yahoo team page, select the roster table, copy it (Ctrl+C) and paste it here (Ctrl+V). Players are matched by initial, last name and team.</div>' +
        '<textarea id="yhText" placeholder="C. Cunningham DET&#10;D. Vassell SAS&#10;..."></textarea>' +
        '<div class="row"><button type="button" id="yhPrev">Preview</button> <button type="button" id="yhClose">Close</button></div>' + inner + "</div>";
    }
    function open() { shell(""); panel.hidden = false; setTimeout(function () { var t = document.getElementById("yhText"); if (t) t.focus(); }, 0); }
    document.getElementById("yhBtn").addEventListener("click", function () { if (panel.hidden) open(); else panel.hidden = true; });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") panel.hidden = true; });
    panel.addEventListener("click", function (e) {
      var id = e.target.id;
      if (id === "yhClose") { panel.hidden = true; return; }
      if (id === "yhPrev") {
        var txt = document.getElementById("yhText").value;
        var go = playersAll ? Promise.resolve() : loadPlayers(false).catch(function () {});
        go.then(function () {
          if (!playersAll || !playersAll.length) { shell('<div class="row warn">The player list could not be loaded. Open the Player List sheet once and try again.</div>'); document.getElementById("yhText").value = txt; return; }
          last = parseYahoo(txt, playersAll);
          var inner = '<div class="row"><b>' + last.matched.length + " matched</b> (untick any you do not want, for example the opponent's players)</div>" +
            last.matched.map(function (x) { return '<label class="pl"><input type="checkbox" data-yh="' + esc(x.p.id) + '" checked> ' + esc(x.p.name) + " (" + esc(x.p.team) + " " + esc(x.p.pos) + ")" + (x.amb ? ' <span class="warn">- several players share this name, check it</span>' : "") + "</label>"; }).join("") +
            (last.unmatched.length ? '<div class="row warn">Not found: ' + esc(last.unmatched.join(", ")) + "</div>" : "") +
            '<div class="row"><label><input type="radio" name="yhMode" value="replace" checked> Replace my list</label> &nbsp; <label><input type="radio" name="yhMode" value="add"> Add to my list</label></div>' +
            '<div class="row"><button type="button" id="yhApply">Apply to My Players</button></div>';
          shell(inner);
          document.getElementById("yhText").value = txt;
        });
        return;
      }
      if (id === "yhApply" && last) {
        var ids = {};
        Array.prototype.forEach.call(panel.querySelectorAll("input[data-yh]"), function (cb) { if (cb.checked) ids[cb.getAttribute("data-yh")] = 1; });
        var picked = last.matched.filter(function (x) { return ids[x.p.id]; }).map(function (x) { return { name: x.p.name, id: String(x.p.id) }; });
        var mode = panel.querySelector('input[name="yhMode"]:checked').value;
        var before = roster.length;
        if (mode === "replace") roster = picked;
        else picked.forEach(function (it) { if (rosterIndex(it.name, it.id) < 0) roster.push(it); });
        saveRoster();
        statusLeft.textContent = (mode === "replace" ? "List replaced: " : "Added: ") + picked.length + " player(s) from Yahoo";
        panel.hidden = true;
        mineCache = mineCache;
        fillNewsPlayers();
        repaintCurrent();
        saveSettings();
      }
    });
  })();

  /* ---------- Export and import ---------- */
  function exportList() {
    var blob = new Blob([JSON.stringify({ app: "Production_Schedule", version: 3, players: roster, watch: watch, newsArchive: newsArch, settings: getSettings() }, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "my_players.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  function importText(text) {
    var items = [], restored = false, restoredNews = 0;
    try {
      var v = JSON.parse(text);
      if (v && !Array.isArray(v) && typeof v === "object") {
        if (v.settings) { applySettings(v.settings); syncControls(); restored = true; }
        if (Array.isArray(v.watch)) v.watch.forEach(function (w) { if (w && w.name && watchIndex(w.id) < 0 && (w.id || true)) { watch.push({ name: String(w.name), id: w.id ? String(w.id) : "" }); } });
        saveWatch();
        if (Array.isArray(v.newsArchive)) { var an = archAdd(v.newsArchive.filter(function (x) { return x && x.id != null && x.t; })); restoredNews = an; }
        v = Array.isArray(v.players) ? v.players : [];
      }
      if (Array.isArray(v)) v.forEach(function (x) {
        if (typeof x === "string") items.push({ name: x, id: "" });
        else if (x && x.name) items.push({ name: String(x.name), id: x.id ? String(x.id) : "" });
      });
    } catch (e) {
      text.split(/\r?\n/).forEach(function (l) { if (l.trim()) items.push({ name: l.trim(), id: "" }); });
    }
    var added = 0;
    items.forEach(function (it) { if (rosterIndex(it.name, it.id) < 0) { roster.push(it); added++; } });
    saveRoster();
    statusLeft.textContent = "Imported " + added + " player(s)" + (restored ? " and your settings" : "") + (restoredNews ? " and " + restoredNews + " news item(s)" : "");
    if (document.getElementById("catPanel") && !document.getElementById("catPanel").hidden) renderCatPanel();
    repaintCurrent();
    saveSettings();
  }

  /* ---------- Events ---------- */
  wrap.addEventListener("click", function (e) {
    var td = e.target.closest ? e.target.closest("td") : null;
    if (!td) return;
    var tr = td.parentNode;
    var sum = 0, kids = tr.querySelectorAll("td");
    for (var i = 0; i < kids.length && kids[i] !== td; i++) sum += kids[i].colSpan || 1;
    selC = sum;
    selR = tr.rowIndex;
    applySel();
    var fi = td.getAttribute("data-fi");
    if (fi != null && sheet === "pick") { pickFilters.splice(Number(fi), 1); paint(pickRows()); return; }
    var sk = td.getAttribute("data-sk");
    if (sk) { handleSort(sk); return; }
    var gb = td.getAttribute("data-gb");
    if (gb && !eventId && sheet === "mine") { openGame(gb); return; }
    var gid = td.getAttribute("data-gid");
    if (gid && !eventId && sheet === "mine") { openGamePbp(gid); return; }
    if (sheet === "pick" && tr.getAttribute("data-pk")) {
      if (td.classList.contains("wcell")) toggleWatch(tr.getAttribute("data-pk"));
      else if (td.classList.contains("tick") || td.classList.contains("name")) togglePick(tr.getAttribute("data-pk"));
      return;
    }
    if (eventId && sheet === "box" && td.classList.contains("wcell") && td.getAttribute("data-pn")) { toggleWatch(td.getAttribute("data-pid"), td.getAttribute("data-pn")); return; }
    if (sheet === "mine" && td.classList.contains("xmine")) { toggleMine(td.getAttribute("data-pid"), td.getAttribute("data-pn")); return; }
    if (sheet === "mine" && tr.getAttribute("data-pk")) {
      var wid = tr.getAttribute("data-pk");
      if (td.classList.contains("xcell")) toggleWatch(wid);
      else if (td.classList.contains("acell")) { var wp = (playersAll || []).filter(function (x) { return x.id === wid; })[0]; if (wp) toggleMine(wp.id, wp.name); }
      return;
    }
    if (!eventId && sheet === "list" && tr.getAttribute("data-id")) openGame(tr.getAttribute("data-id"));
  });
  var coarse = false;
  try { coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches); } catch (e) {}
  var lastTap = { td: null, t: 0 };
  wrap.addEventListener("click", function (e) {
    if (!coarse) return;
    var td = e.target.closest ? e.target.closest("td") : null;
    if (!td) return;
    var now = Date.now();
    if (lastTap.td === td && now - lastTap.t < 500) { lastTap = { td: null, t: 0 }; onDouble(td); }
    else lastTap = { td: td, t: now };
  });
  wrap.addEventListener("dblclick", function (e) {
    if (coarse) return;
    onDouble(e.target.closest ? e.target.closest("td") : null);
  });
  function onDouble(td) {
    var lk = td && td.parentNode.querySelector("td[data-lk]");
    if (lk && (sheet === "news" || sheet === "mine")) { window.open(lk.getAttribute("data-lk"), "_blank", "noopener"); return; }
    if (!td || !eventId || sheet !== "box") return;
    var pn = td.getAttribute("data-pn");
    if (pn && !td.classList.contains("wcell")) toggleMine(td.getAttribute("data-pid"), pn);
  }
  document.getElementById("tabsbar").addEventListener("click", function (e) {
    var s = e.target.getAttribute && e.target.getAttribute("data-sheet");
    if (!s) return;
    selR = 1; selC = 0;
    if (s === "stats") { openStats(); return; }
    if (s === "pick") { openPick(); return; }
    if (s === "mine") { openMine(); return; }
    if (s === "sched") { openSched(); return; }
    if (s === "news") { openNews(); return; }
    if (s === "inj") { openInj(); return; }
    if (s === "list") {
      holdGame();
      sheet = "list"; renderChrome(); paint(listRows(lastList || [])); loadList(); return;
    }
    if (s === "log") { holdGame(); sheet = "log"; renderChrome(); paint(logRows()); return; }
    if (!eventId && heldGame) {
      eventId = heldGame; sheet = s; selR = 1; selC = 0;
      renderChrome();
      if (lastSummary) renderDetail(); else paint(loadingRows());
      clearTimeout(timer);
      loadDetail();
      return;
    }
    sheet = s;
    if (eventId) { renderDetail(); }
    else { renderChrome(); paint(logRows()); }
  });
  function dateNav(change) {
    if (change === "today") { viewDate = null; viewPinned = false; }
    else if (viewDate) { viewDate = shiftDate(viewDate, change); viewPinned = true; }
    else return;
    if (sheet !== "mine") sheet = "list";
    statusLeft.textContent = "Calculating…";
    renderChrome();
    loadList();
  }
  document.getElementById("prev").addEventListener("click", function () { dateNav(-1); });
  document.getElementById("next").addEventListener("click", function () { dateNav(1); });
  document.getElementById("today").addEventListener("click", function () { dateNav("today"); });
  document.getElementById("gameSel").addEventListener("change", function (e) { switchGame(e.target.value); });
  document.getElementById("back").addEventListener("click", closeGame);
  document.getElementById("toMineBtn").addEventListener("click", function () { openMine(); });
  document.getElementById("toPbpBtn").addEventListener("click", function () { if (!eventId) return; sheet = "pbp"; selR = 1; selC = 0; renderChrome(); renderDetail(); });
  document.getElementById("toBoxBtn").addEventListener("click", function () { if (!eventId) return; sheet = "box"; selR = 1; selC = 0; renderChrome(); renderDetail(); });
  document.getElementById("filterBtn").addEventListener("click", function () { filter = filter === "all" ? "scoring" : (filter === "scoring" ? "mine" : "all"); renderDetail(); });
  document.getElementById("refreshBtn").addEventListener("click", function () { clearTimeout(timer); refresh(); if (sheet === "mine" && !eventId) loadWatch(true); });
  document.getElementById("pickBtn").addEventListener("click", openPick);
  function statChanged() { if (sheet !== "stats") return; if (useLog() && roster.length) { paint(loadingRows()); reloadStats(false); } else paint(statRows()); }
  document.getElementById("statMode").addEventListener("change", function (e) { statMode = e.target.value; statModeChosen = true; statChanged(); });
  document.getElementById("statView").addEventListener("change", function (e) { statView = e.target.value; statChanged(); });
  (function () {
    var fc = document.getElementById("fCol");
    fc.innerHTML = PICK_STAT_COLS.map(function (l) { return '<option value="' + l + '">' + l + "</option>"; }).join("");
    fc.value = "PTS";
    function addF() {
      var v = parseFloat(document.getElementById("fVal").value);
      if (isNaN(v)) return;
      pickFilters.push({ l: fc.value, op: document.getElementById("fOp").value, v: v });
      document.getElementById("fVal").value = "";
      if (sheet === "pick") paint(pickRows());
    }
    document.getElementById("fAdd").addEventListener("click", addF);
    document.getElementById("fVal").addEventListener("keydown", function (e) { if (e.key === "Enter") addF(); });
    document.getElementById("fClear").addEventListener("click", function () { pickFilters = []; if (sheet === "pick") paint(pickRows()); });
  })();
  ["newsType", "newsPlayer"].forEach(function (id) { document.getElementById(id).addEventListener("change", function () { if (sheet === "news") { paint(newsRows()); startTranslate(); } }); });
  document.getElementById("newsTrBtn").addEventListener("click", function () {
    var btn = this;
    trOn = !trOn; trNote = "";
    btn.textContent = "Translate: " + (trOn ? "On" : "Off");
    if (!trOn) { trRun++; if (sheet === "news") paint(newsRows()); return; }
    var go = trEng === "c" ? getTranslator() : Promise.resolve();
    go.then(function () {
      trNote = trEng === "g" ? "Engine: Google web translate (unofficial)" : (trEngine ? "Engine: Chrome built-in translator" : "Chrome built-in translator is not available, using Google web translate");
      if (sheet === "news") { paint(newsRows()); startTranslate(); }
    });
  });
  document.getElementById("newsTrEng").addEventListener("change", function (e) {
    trEng = e.target.value; trNote = ""; trRun++;
    if (trOn) {
      var go = trEng === "c" ? getTranslator() : Promise.resolve();
      go.then(function () {
        trNote = trEng === "g" ? "Engine: Google web translate (unofficial)" : (trEngine ? "Engine: Chrome built-in translator" : "Chrome built-in translator is not available, using Google web translate");
        if (sheet === "news") { paint(newsRows()); startTranslate(); }
      });
    }
  });
  document.getElementById("injScope").addEventListener("change", function (e) { injScope = e.target.value; if (sheet === "inj") paint(injRows()); });
  document.getElementById("injStatus").addEventListener("change", function (e) { injStatus = e.target.value; if (sheet === "inj") paint(injRows()); });
  document.getElementById("newsScope").addEventListener("change", function (e) { setNewsScope(e.target.value); });
  document.getElementById("newsSearch").addEventListener("keydown", function (e) { if (e.key === "Enter") runNewsSearch(); });
  document.getElementById("newsWrapBtn").addEventListener("click", function () {
    newsWrap = !newsWrap;
    this.textContent = "Wrap text: " + (newsWrap ? "On" : "Off");
    if (sheet === "news") paint(newsRows());
  });
  document.getElementById("pickView").addEventListener("change", function (e) { pickView = e.target.value; if (sheet === "pick") paint(pickRows()); });
  document.getElementById("pickSeason").addEventListener("change", function (e) { pickSeason = Number(e.target.value); pickSeasonChosen = true; pickLoadSeason(false); });
  document.getElementById("teamSel").addEventListener("change", function (e) { pickTeam = e.target.value; if (sheet === "pick") paint(pickRows()); });
  document.getElementById("playerSearch").addEventListener("input", function (e) { pickQuery = e.target.value; if (sheet === "pick") paint(pickRows()); });
  document.getElementById("selOnlyBtn").addEventListener("click", function () {
    pickSelOnly = !pickSelOnly;
    this.textContent = "Selected only: " + (pickSelOnly ? "On" : "Off");
    if (sheet === "pick") paint(pickRows());
  });
  document.getElementById("watchModeBtn").addEventListener("click", function () {
    watchMode = watchMode === "today" ? "season" : "today";
    this.textContent = "Watchlist: " + (watchMode === "today" ? "Today" : "Season");
    if (sheet === "mine") paint(mineRows());
  });
  document.getElementById("watchOnlyBtn").addEventListener("click", function () {
    pickWatchOnly = !pickWatchOnly;
    this.textContent = "Watching only: " + (pickWatchOnly ? "On" : "Off");
    if (sheet === "pick") paint(pickRows());
  });
  document.getElementById("reloadBtn").addEventListener("click", function () {
    statusLeft.textContent = "Calculating…";
    paint(loadingRows());
    loadPlayers(true).then(function () { fillTeamSel(); if (sheet === "pick") paint(pickRows()); return pickLoadSeason(true); }).catch(pickError);
  });
  document.getElementById("exportBtn").addEventListener("click", exportList);
  document.getElementById("importBtn").addEventListener("click", function () { document.getElementById("importFile").click(); });
  document.getElementById("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { importText(String(rd.result || "")); };
    rd.readAsText(f);
    e.target.value = "";
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (eventId) closeGame();
  });
  function stepZoom(d) {
    var i = ZOOMS.indexOf(zoomPct) + d;
    if (i < 0 || i >= ZOOMS.length) return;
    zoomPct = ZOOMS[i];
    repaintCurrent();
    stamp();
  }
  document.getElementById("zoomOut").addEventListener("click", function () { stepZoom(-1); });
  document.getElementById("zoomIn").addEventListener("click", function () { stepZoom(1); });
  var wasNarrow = isNarrow(), resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (isNarrow() !== wasNarrow) { wasNarrow = isNarrow(); repaintCurrent(); } }, 300);
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && sheet !== "stats") refresh(); });

  try { applySettings(JSON.parse(localStorage.getItem(SET_KEY) || "null")); } catch (e) {}
  var startSheet = lastMainSheet;
  settingsReady = true;
  syncControls();
  renderChrome();
  paint(loadingRows());
  loadList();
  (function () {
    var m = startSheet;
    if (m === "pick") openPick();
    else if (m === "mine") openMine();
    else if (m === "sched") openSched();
    else if (m === "news") openNews();
    else if (m === "inj") openInj();
    else if (m === "stats") openStats();
    else if (m === "log") { sheet = "log"; renderChrome(); paint(logRows()); }
  })();
})();
</script>

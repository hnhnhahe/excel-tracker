<script>
(function () {
  var VERSION = "V1.A1.47";
  var CHANGELOG = [
    { v: "V1.A1.47", d: "2026-10-30", n: "Game Log and Player Stats now have Player List and My Players buttons right after Refresh All, so you can go back without using the tabs at the bottom." },
    { v: "V1.A1.46", d: "2026-10-29", n: "Manual tab (after Changelog) with the user manual: what the tool is, how each tab works, League Settings and Export for AI, backup, and common questions." },
    { v: "V1.A1.45", d: "2026-10-29", n: "Team Schedule is now one continuous table. Every team is a row and every day is a column showing the opponent (vs for home, @ for away; back-to-backs in orange). After the last day of each week there is a Wk total column. You choose the first day of your league week (Monday to Sunday, default Monday) and the number of weeks (2, 4, 6 or 8); both are remembered and included in Export and Import. The Left column shows the games from today to the end of this week, and Total at the end adds Left and the later weeks. The most games in a week are green and the fewest red; click any header to sort; days already played are grey; the last row shows how many teams play each day." },
    { v: "V1.A1.44", d: "2026-10-29", n: "Team Schedule. New Team Schedule tab (after Schedule), one row per team. Weekly totals: games per Monday-to-Sunday week (US Eastern dates) for the next 2, 4, 6 or 8 weeks, plus Left (games from today to Sunday) and a total. The team with the most games in a week is green and the team with the fewest is red. Teams of your My Players and Watchlist players are in blue. Daily detail: choose a week and see the opponent of every team on each day (vs or @), back-to-back games in orange, a Games and a B2B column, and the number of teams playing each day. Click any header to sort. The schedule of all 30 teams comes from ESPN, is kept in the browser for 24 hours and is loaded again when it is older than 1 hour and you press Refresh All." },
    { v: "V1.A1.43", d: "2026-10-27", n: "Game Log team filter. New Team drop-down in the Game Log tab. When you choose a team, the player drop-down gets a third group with all players of that team, and the search box suggests only that team. The My Players and Watchlist groups are always shown in full and are not affected by the team." },
    { v: "V1.A1.42", d: "2026-10-27", n: "Game Log. New Game Log tab (after Injuries) shows one player at a time, one row per game played, newest first: date (US Eastern), opponent, result and score, minutes, your categories, and FG, FT, 3PT and +/-. Under the header there are Season average, Last 5 and Last 10 rows. Pick the player from the drop-down (My Players and Watchlist) or type any player name in the search box, and choose the season (this season and the two before). You can also open it from Player List (new Log column right after the star), and by double-clicking (or double-tapping) a player name in My Players or the Watchlist. Games where the player did not play are not listed." },
    { v: "V1.A1.41", d: "2026-10-24", n: "Candidate Pool in Export for AI. The export can now also list free-agent candidates from all players, not only the Watchlist. League Settings has a switch (on by default) and three boxes you can change: Own% at or below (default 15), Minutes per game at least (default 10) and Number of players (default 50). Players on My Players or the Watchlist and players who are out for the season are left out. The candidates are ranked by a Fit score, the sum of z-scores over your categories (or points per game in points mode) taken from this season when a player has 5 or more games and otherwise from last season. Own% is the ESPN number, so the pool is a good guess of who is free, not a guarantee. Role and outlook is also written for the candidates." },
    { v: "V1.A1.40", d: "2026-10-24", n: "Role and outlook in Export for AI. New switch in League Settings (on by default). The export now has Minutes per game (season and recent) and a new Role and outlook section with one block per player: age and years in the league, minutes this season and in the recent window, last season per game (games played, minutes and your categories), the minutes rank in the team, the same-position teammates with the most minutes (and whether they are injured), and injured teammates who normally play 15 minutes or more. The source has no starter flag, so the minutes rank is used instead. Minutes use last season when a player has fewer than 5 games this season. The player list is reloaded once to add age and experience." },
    { v: "V1.A1.39", d: "2026-10-24", n: "League Settings and Export for AI. In My Players there are two new buttons. League Settings lets you choose the scoring method (head-to-head categories or points with a weight for each stat), the categories, the roster slots (for example PG, SG, G, SF, PF, F, C, C, UTIL, UTIL, BN, BN, BN), the weekly add limit, the recent window (last 7 days, 14 days, 5 games, 10 games) and a free note for the AI. Export for AI builds one text for My Players and the Watchlist (season and recent per-game numbers, shooting volume, injury, games this week, Own%, Chg%, latest news) with instructions to recommend who to drop and who to add. You can copy it or download it. The settings are remembered and included in Export and Import." },
    { v: "V1.A1.38", d: "2026-10-24", n: "Zoom. New A− and A+ buttons at the end of the toolbar make the table smaller or larger (60%, 70%, 80%, 100%, 120%, 150%) on both phone and desktop. The size is remembered and is included in Export and Import." },
    { v: "V1.A1.37", d: "2026-10-24", n: "Phone layout. On screens narrower than 700 px the fake menu bar is hidden, buttons, drop-downs and cells are bigger for fingers, input boxes no longer make the page zoom, only the player name column stays frozen (My and Player in Player List), and the page uses the real screen height. Because phones have no double-click, double-tap now does what double-click does (add or remove a player in Box Score, open an article in News or My Players). Rotating the phone redraws the sheet. On a computer nothing changes." },
    { v: "V1.A1.36", d: "2026-10-22", n: "Player List now has an Injury column after Chg% (same text as My Players, for example Out · Foot – Fracture (Left) · return 2026-11-20). Click the column title to sort: most serious first (Out for season, Out, then day-to-day), then a second click for the reverse. Out players are shown in bold." },
    { v: "V1.A1.35", d: "2026-10-22", n: "Injuries. New Injuries sheet (after News) from the ESPN injury list: status, injury and side, expected return date, last update and the full note. Scope: My Players + Watchlist, My Players, Watchlist or League-wide, plus a status filter. My Players and the Watchlist have a new Injury column after Chg% (for example Out · Foot – Fracture (Left) · return 2026-11-20). My Players are shown in blue and Watchlist players in purple. Data is loaded when you open My Players or Injuries or click Refresh All and kept for 10 minutes." },
    { v: "V1.A1.34", d: "2026-10-22", n: "Removed the last visible mentions of the league abbreviation from the Changelog and from one error message. No other change." },
    { v: "V1.A1.33", d: "2026-10-22", n: "The Box Score sheet now has a Play-by-Play button in the top bar (after My Players), so you can switch between the two without using the tabs at the bottom. The Play-by-Play sheet has the matching Box Score button." },
    { v: "V1.A1.32", d: "2026-10-22", n: "Play-by-Play now has a Box Score button right after My Players (it only shows on the Play-by-Play sheet). In My Players and the Watchlist (Today view), click a Team cell to open that game's Box Score; clicking a Game cell still opens its Play-by-Play." },
    { v: "V1.A1.31", d: "2026-10-22", n: "The Back button works as before (it returns to Sheet1). While a game is open there is a new My Players button right after Refresh All that takes you to the My Players sheet; the game tabs stay open so you can come back to it." },
    { v: "V1.A1.30", d: "2026-10-21", n: "In My Players, click a Game cell (for example vs ATL 31.1 - 1st) to jump straight to that game's Play-by-Play. The same works for the Game cell in the Watchlist (Today view). The Back button then returns to My Players. Game cells are underlined when you point at them." },
    { v: "V1.A1.29", d: "2026-10-21", n: "Automatic date change. Sheet1 and My Players now follow ESPN's current game day on every refresh, so a tab left open moves to the next day by itself. Once you press Prev or Next the date stays on the day you picked; press Today to follow ESPN's current day again." },
    { v: "V1.A1.28", d: "2026-10-21", n: "Fixed the date label on Sheet1 and My Players: when ESPN returns no data for the day you picked with Next or Prev (for example a day without games), the label now shows the date you picked instead of staying on the old date." },
    { v: "V1.A1.27", d: "2026-10-21", n: "My Players now shows the Team and Game columns for players who have no stat line yet (game not started, no game that day, or waiting for data), the same way the Watchlist does, for example Not started Oct 22, 8:00 AM or No game." },
    { v: "V1.A1.26", d: "2026-10-21", n: "News archive. Every news item the program loads is now saved in this browser for 30 days (up to 3000 items), so older news no longer disappears when ESPN pushes it out of its latest 50. The News sheet shows the archive together with the newest items for the chosen scope (My players, League-wide or a searched player), and its title row shows how many items are archived. Export now includes the archive and Import merges it without duplicates. The archive only grows while the program is open, so open the News sheet at least once a day." },
    { v: "V1.A1.25", d: "2026-10-21", n: "New Own% (roster percentage) and Chg% (change since the previous day, the add/drop trend) columns in Player List, My Players and the Watchlist. The numbers come from ESPN fantasy, so they describe ESPN leagues, not your Yahoo league. They are loaded when you open those sheets or click Refresh All, kept for 30 minutes, and every column can be sorted." },
    { v: "V1.A1.24", d: "2026-10-21", n: "Box Score has a star column right after the player name. Click the star to add or remove that player in the Watchlist (a filled star means he is watched). Double-click on the name still adds or removes a player in My Players." },
    { v: "V1.A1.23", d: "2026-10-21", n: "Play-by-Play now marks plays by your players. A new last column, Note, shows MY: name for a My Players player and WATCH: name for a Watchlist player, and shades the Play and Note cells blue (My Players) or purple (Watchlist). The Filter button now cycles All, Scoring, Mine and Watch (only plays that involve your players or watched players). Box Score shows watched players in purple." },
    { v: "V1.A1.22", d: "2026-10-21", n: "Watchlist: new Season / Today button on My Players. Today shows each watched player's live or final stat line from today's games in the same category columns, with green shading while he is on the court (not counted in the Total row). The setting is remembered. My Players now also has GP, Next 7, Wk left and Latest news columns (the Total row adds up Next 7 and Wk left), and an x to remove a player. Latest news wraps instead of being cut off." },
    { v: "V1.A1.21", d: "2026-10-21", n: "The Watchlist now sits at the bottom of the My Players sheet, two blank rows under the Total row, using the same category columns, so you compare your players and your targets on one page. The separate Watchlist tab is gone. Player List: the Sel column is renamed My, and the star column now follows the player name." },
    { v: "V1.A1.20", d: "2026-10-21", n: "New Watchlist sheet for players you are watching (pickup candidates). In Player List click the star column to add or remove a player (Watching only button filters the list). The Watchlist shows each player's team, next game, games in the next 7 days and left this Mon-Sun week, season per-game stats in your chosen categories, and the latest news headline. Click the plus to add a player to My Players, or the cross to drop him from the Watchlist. The watchlist is saved with Export and Import." },
    { v: "V1.A1.19", d: "2026-10-21", n: "My Players: new Paste from Yahoo button. Open your Yahoo roster page, select and copy the roster table, paste it into the box, and the sheet matches the players (names like C. Cunningham DET), shows a preview you can untick, then replaces or adds to your list. Takes a few seconds, so you do not have to rebuild the list by hand after pickups and drops." },
    { v: "V1.A1.18", d: "2026-10-21", n: "Your whole working state is now remembered automatically and opens exactly as you left it: the sheet you were on, categories, sort orders, filters, season and view choices, news options and translation. Export now saves the player list together with all of these settings, and Import restores them (old my_players.json files still import fine). Fixed: categories were not part of the backup file." },
    { v: "V1.A1.17", d: "2026-10-21", n: "My Players: new Categories button opens a list of scoring categories (FG%, FT%, 3PTM, 3PT%, PTS, REB, AST, ST, BLK, TO, A/T, DD and more). Tick the ones your league uses and the sheet shows exactly those columns, with a Total row calculated correctly (percentages from made / attempted, A/T from total AST / total TO, DD as a count). Your choice is saved in this browser." },
    { v: "V1.A1.16", d: "2026-10-21", n: "Translation keeps people's names in English: every league player (full name, first name or last name) plus other First Last names such as coaches and reporters are protected before translating and put back afterwards. If a translator drops a protected name, that text is translated in pieces around the names instead." },
    { v: "V1.A1.15", d: "2026-10-21", n: "News sheet: the Player and Time columns are frozen while you scroll sideways; long articles are capped at about 8 lines in the cell (select the cell to read the full text in the formula bar). Translation: new Engine dropdown (Google web translate is the default, Chrome built-in is the alternative) and a Taiwan terminology pass (for example Celtics = 塞爾提克, steal = 抄截, starter = 先發)." },
    { v: "V1.A1.14", d: "2026-10-21", n: "Box Score and Play-by-Play now have a Game dropdown to jump straight to any game on the current date (use Sheet1 date arrows to change the date). News sheet has a Translate button that adds Traditional Chinese Headline and Details columns (Chrome built-in translator first, Google web translate as fallback)." },
    { v: "V1.A1.13", d: "2026-10-21", n: "News sheet: text now wraps inside the Headline and Details cells (Wrap text button turns it on or off). Added a Scope dropdown: My players, League-wide (latest fantasy notes plus general stories for all players) and Search result. Type any player's name in the search box and press Enter to see that player's news, even if he is not in My Players." },
    { v: "V1.A1.12", d: "2026-10-21", n: "New News sheet: the latest fantasy news (injury and lineup notes, stories, video) for every player in My Players, newest first, with a marker for items you have not seen yet. Select a row to read the full text in the formula bar; double-click a row to open the article. Filter by player or by type." },
    { v: "V1.A1.11", d: "2026-10-21", n: "New Schedule sheet for My Players: today's opponent and tip-off time (UTC+8, or live score / Final), the next 7 days game by game, games in the next 7 days, and games left in the current Mon-Sun fantasy week. A bottom row counts how many of your players play each day." },
    { v: "V1.A1.10", d: "2026-10-21", n: "Freeze Panes: the title and header rows plus the Sel / Player columns stay in view while you scroll (Player List, My Players, Player Stats, Sheet1). Player List now has column filters (for example PTS > 15) that can be combined; click a filter in row 2 to remove it. Fixed: a season ESPN has no data for yet (2026-27 at the start of the season) used to show last season's numbers under the new label; it now falls back to last season correctly." },
    { v: "V1.A1.9", d: "2026-10-21", n: "Game tabs (Box Score, Play-by-Play) now stay open when you switch to Player List, My Players, Player Stats or Changelog. Added a View dropdown (Per game / Total) to Player List and Player Stats. Player Stats gained Last 7 / 14 / 30 days and Last 5 / 10 games ranges (built from each player's game log) for fantasy use." },
    { v: "V1.A1.8", d: "2026-10-21", n: "Player List now shows per-game stats (GP, MIN, PTS, REB, AST, STL, BLK, TO, PF, FG%, 3P%, FT%) with a Season dropdown, so you can compare players before picking. Player Stats also has a Season dropdown with every season back to 2000-01, plus Career averages and All seasons." },
    { v: "V1.A1.7", d: "2026-10-21", n: "Player List: a row is now added or removed only by clicking the Sel box or the player name (clicking empty cells no longer selects). New Player Stats sheet: per-game averages for your players for this season, last season, career, or every season." },
    { v: "V1.A1.6", d: "2026-10-21", n: "Player List loading: plain requests without extra headers, falls back to fixed team numbers 1-30 when the team list request fails, and the error message now shows the address that failed." },
    { v: "V1.A1.5", d: "2026-10-21", n: "New Player List sheet: browse every player, filter by team, search by name, click a row to add or remove a player from your list. My Players now follows that list. The typed-name editor was removed." },
    { v: "V1.A1.4", d: "2026-10-21", n: "New My Players sheet: keep your own player list (saved in this browser, with Export and Import), see their live stats from every game of the day in one table, with a totals row. Double-click a name in Box Score to add or remove a player." },
    { v: "V1.A1.3", d: "2026-10-21", n: "Box Score: players currently on the court get a green row shade while the game is live. If the data source does not report who is on court, a note appears instead." },
    { v: "V1.A1.2", d: "2026-10-21", n: "Click a column title to sort (Sheet1, Box Score). Click Period in Play-by-Play to flip newest/oldest. Version number and Changelog sheet added." },
    { v: "V1.A1.1", d: "2026-10-21", n: "Spreadsheet-style layout, English text, Box Score, Play-by-Play, Refresh All button." }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {

  function shiftDate(iso, days) {
    var p = iso.split("-").map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2] + days)).toISOString().slice(0, 10);
  }
  function teamName(t) { return (t && (t.displayName || t.shortDisplayName || t.abbreviation)) || ""; }
  function colLetter(i) { var s = "", n = i + 1; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  function perLabel(n) { return n <= 4 ? "Q" + n : "OT" + (n - 4 > 1 ? n - 4 : ""); }
  function numOf(v) { var m = String(v == null ? "" : v).match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; }
  function cmp(a, b, d, isNum) {
    if (isNum) {
      var an = isNaN(a), bn = isNaN(b);
      if (an && bn) return 0;
      if (an) return 1;
      if (bn) return -1;

    return String(a).localeCompare(String(b)) * d;
  }

    return { t: text + (active ? (dir > 0 ? " ▲" : " ▼") : ""), cls: cls + " sortable", sk: sk };

  /* ---------- Saved player list ---------- */
  function norm(s) {
    var t = String(s || "").toLowerCase();
    try { t = t.normalize("NFD").replace(/[̀-ͯ]/g, ""); } catch (e) {}
    return t.replace(/[.'’,\-]/g, " ").replace(/\b(jr|sr|ii|iii|iv)\b/g, "").replace(/\s+/g, " ").trim();
  }
  function loadRoster() {
    try {
      var v = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      if (!Array.isArray(v)) return [];
      return v.filter(function (x) { return x && x.name; }).map(function (x) { return { name: String(x.name), id: x.id ? String(x.id) : "" }; });
    } catch (e) { return []; }
  }
  function saveRoster() {
    var ok = true;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(roster)); } catch (e) { ok = false; }

    return ok;
  }
  function rosterIndex(name, id) {
    for (var i = 0; i < roster.length; i++) {
      if (id && roster[i].id && String(roster[i].id) === String(id)) return i;
      if (norm(roster[i].name) === norm(name)) return i;
    }
    return -1;
  }
  function athleteIndex(ath) { return ath ? rosterIndex(ath.displayName || ath.shortName || "", ath.id) : -1; }
  function toggleMine(id, name) {
    var i = rosterIndex(name, id);
    if (i >= 0) { roster.splice(i, 1); statusLeft.textContent = "Removed from My Players: " + name; }
    else { roster.push({ name: name, id: id ? String(id) : "" }); statusLeft.textContent = "Added to My Players: " + name; }
    saveRoster();
    if (sheet === "pick") paint(pickRows());
    else if (sheet === "mine") paint(mineRows());
    else if (eventId) renderDetail();
  }

  /* ---------- Grid renderer ---------- */
  // rows: [{ c: [{ t, cls, span, html, sk, pid, pn }], id }]
  function gridHtml(rows) {
    var n = 12, i;
    rows.forEach(function (r) { var w = 0; r.c.forEach(function (x) { w += x.span || 1; }); if (w > n) n = w; });
    var out = '<table><thead><tr><th class="corner"></th>';
    for (i = 0; i < n; i++) out += "<th>" + colLetter(i) + "</th>";
    out += "</tr></thead><tbody>";
    var total = Math.max(rows.length, 45);
    for (var r = 0; r < total; r++) {
      var row = rows[r] || { c: [] };
      out += "<tr" + (row.id ? ' data-id="' + esc(row.id) + '" class="clk"' : (row.pk ? ' data-pk="' + esc(row.pk) + '" class="pk"' : "")) + '><th class="rn">' + (r + 1) + "</th>";
      var w = 0;
      row.c.forEach(function (x) {
        var span = x.span || 1;
        out += "<td" + (span > 1 ? ' colspan="' + span + '"' : "") + (x.cls ? ' class="' + x.cls + '"' : "") +
               (x.sk ? ' data-sk="' + esc(x.sk) + '"' : "") + (x.fi != null ? ' data-fi="' + x.fi + '"' : "") + (x.lk ? ' data-lk="' + esc(x.lk) + '"' : "") + (x.gid ? ' data-gid="' + esc(x.gid) + '"' : "") + (x.gb ? ' data-gb="' + esc(x.gb) + '"' : "") +
               (x.pn ? ' data-pid="' + esc(x.pid || "") + '" data-pn="' + esc(x.pn) + '"' : "") + ">" +
               (x.html != null ? x.html : esc(x.t)) + "</td>";
        w += span;
      });
      for (; w < n; w++) out += "<td></td>";
      out += "</tr>";
    }
    return out + "</tbody></table>";
  }

  function tdAt(tr, col) {
    var sum = 0, tds = tr.querySelectorAll("td");
    for (var i = 0; i < tds.length; i++) { var s = tds[i].colSpan || 1; if (col < sum + s) return tds[i]; sum += s; }
    return tds[tds.length - 1];
  }
  function applySel() {
    var table = wrap.querySelector("table");
    if (!table) return;
    var tr = table.rows[selR] || table.rows[1];
    if (!tr) return;
    var td = tdAt(tr, selC);
    if (!td) return;
    var prev = wrap.querySelector("td.sel");
    if (prev) prev.classList.remove("sel");
    td.classList.add("sel");
    nameBox.textContent = colLetter(selC) + selR;
    fVal.textContent = td.textContent.trim();
  }
  function isNarrow() { return window.innerWidth < 700; }
  function freezePanes(rows) {
    var fc = { pick: 3, watch: 3, stats: 1, mine: 1, sched: 1, news: 2, inj: 1, glog: 1, tsch: 1, list: 0 }[sheet];
    if (fc === undefined || eventId) return;
    if (isNarrow()) fc = Math.min(fc, sheet === "pick" ? 2 : 1);
    var hi = -1, i, j;
    for (i = 0; i < rows.length && hi < 0; i++) if (rows[i].c.some(function (c) { return c.cls && /(^| )hdr( |$)/.test(c.cls); })) hi = i;
    var table = wrap.querySelector("table");
    if (hi < 0 || !table || !table.tBodies[0]) return;
    var trs = table.tBodies[0].rows;
    function solid(el) {
      var bg = getComputedStyle(el).backgroundColor;
      el.style.background = (!bg || bg === "transparent" || /rgba\(0, 0, 0, 0\)/.test(bg)) ? "#fff" : bg;
    }
    var lefts = [], acc = 0, hcells = trs[hi].cells;
    for (j = 0; j < hcells.length && j <= fc; j++) { lefts[j] = acc; acc += hcells[j].offsetWidth; }
    var top = table.tHead.offsetHeight;
    for (i = 0; i < trs.length; i++) {
      var cells = trs[i].cells, frozenRow = i <= hi;
      for (j = 0; j < cells.length; j++) {
        var c = cells[j], leftSide = j <= fc && c.colSpan === 1;
        if (!frozenRow && !leftSide) continue;
        if (j > 0 && !frozenRow && !leftSide) continue;
        c.style.position = "sticky";
        if (frozenRow) c.style.top = top + "px";
        if (leftSide) c.style.left = lefts[j] + "px";
        c.style.zIndex = frozenRow ? (leftSide ? 4 : 2) : 1;
        if (j > 0) solid(c);
      }
      if (frozenRow) top += trs[i].offsetHeight;
    }
  }
  var LG = { mode: "cat", slots: "PG, SG, G, SF, PF, F, C, C, UTIL, UTIL, BN, BN, BN", adds: "", notes: "", vol: true, news: true, role: true, pool: true, poolOwn: 15, poolMin: 10, poolN: 50, recent: "r7", w: {} };
  var tsStart = 1, tsWeeks = 6, sortTs = { k: null, d: -1 }, tsCache = null, tsBusy = false;
  var ZOOMS = [60, 70, 80, 100, 120, 150], zoomPct = 100;
  function applyZoom() {

    var games = c.games.filter(function (g) { return parseFloat(g.v.MIN) > 0; });
    var head = [{ t: "Date", cls: "hdr stat" }, { t: "Opp", cls: "hdr num" }, { t: "Result", cls: "hdr stat" }, { t: "MIN", cls: "hdr num" }];
    cats.forEach(function (ct) { head.push({ t: ct.k, cls: "hdr num" }); });
    head.push({ t: "FG", cls: "hdr num" }, { t: "FT", cls: "hdr num" }, { t: "3PT", cls: "hdr num" }, { t: "+/-", cls: "hdr num" });
    rows.push({ c: head });
    if (!games.length) { rows.push({ c: [{ t: "No games played in this season.", span: 8, cls: "dim" }] }); return rows; }
    function r1(v) { return v == null || isNaN(v) ? "" : String(Math.round(v * 10) / 10); }
    function avgRow(label, list) {
      var a = glAgg(list);
      if (!a) return null;
      var r = [{ t: label, cls: "stat bold" }, { t: "", cls: "num" }, { t: "", cls: "stat" }, { t: r1(a.MIN), cls: "num bold" }];
      cats.forEach(function (ct) { r.push({ t: catText(a, ct.k), cls: "num bold" }); });
      r.push({ t: r1(a.FGM) + "-" + r1(a.FGA), cls: "num bold" }, { t: r1(a.FTM) + "-" + r1(a.FTA), cls: "num bold" }, { t: r1(a.TPM) + "-" + r1(a.TPA), cls: "num bold" }, { t: r1(a.PM), cls: "num bold" });
      return { c: r };
    }
    [["Season average (" + games.length + " games)", games], ["Last 5 games", games.slice(0, 5)], ["Last 10 games", games.slice(0, 10)]].forEach(function (x) {
      var ar = avgRow(x[0], x[1]);
      if (ar) rows.push(ar);
    });
    rows.push({ c: [{ t: "DD and TD in the average rows are totals. Percentages come from the summed shots.", span: 12, cls: "dim" }] });
    games.forEach(function (g) {
      var cp = comps(g.v);
      var res = g.res ? g.res + (g.score ? " " + g.score : "") : "";
      var r = [{ t: g.t ? glDateText(g.t) : "", cls: "stat" }, { t: g.opp ? (g.at === "@" ? "@ " : "vs ") + g.opp : "", cls: "num" }, { t: res, cls: "stat " + (g.res === "W" ? "wlw" : (g.res === "L" ? "wll" : "")) }, { t: g.v.MIN != null ? String(g.v.MIN) : "", cls: "num" }];
      cats.forEach(function (ct) { r.push({ t: catText(cp, ct.k), cls: "num" + (ct.k === "PTS" ? " bold" : "") }); });
      r.push({ t: g.v.FG || "", cls: "num" }, { t: g.v.FT || "", cls: "num" }, { t: g.v["3PT"] || "", cls: "num" }, { t: g.v["+/-"] != null ? String(g.v["+/-"]) : "", cls: "num" });
      rows.push({ c: r });
    });
    return rows;
  }
  (function () {
    document.getElementById("glPlayer").addEventListener("change", function (e) {
      var id = e.target.value;
      if (!id) return;
      var p = (playersAll || []).filter(function (x) { return x.id === id; })[0] || roster.concat(watch).filter(function (x) { return String(x.id) === id; })[0];
      glPlayer = { id: id, name: p ? p.name : id };
      glLoad(false);
    });
    document.getElementById("glTeam").addEventListener("change", function (e) { glTeam = e.target.value || "all"; glFillControls(); });
    document.getElementById("glSeason").addEventListener("change", function (e) { glYear = Number(e.target.value) || seasonNow(); glLoad(false); });
    document.getElementById("glSearch").addEventListener("change", function (e) {
      var q = norm(e.target.value);
      if (!q) return;
      var pool = (playersAll || []).filter(function (x) { return glTeam === "all" || x.teamId === glTeam; });
      var p = pool.filter(function (x) { return norm(x.name) === q; })[0];
      if (!p) { var m = pool.filter(function (x) { return norm(x.name).indexOf(q) >= 0; }); if (m.length === 1) p = m[0]; }
      if (!p) { statusLeft.textContent = "No single player matches \"" + e.target.value + "\". Pick a name from the suggestions."; return; }
      e.target.value = "";
      glPlayer = { id: p.id, name: p.name };
      glFillControls();
      glLoad(false);
    });
  })();

  /* ---------- Team Schedule (all teams, by week) ---------- */
  var TS_KEY = "ps_tsched_v1";
  try { var tsc = JSON.parse(localStorage.getItem(TS_KEY) || "null"); if (tsc && tsc.map && Date.now() - tsc.t < 86400000) tsCache = { t: tsc.t, map: tsc.map, bad: tsc.bad || [] }; } catch (e) {}
  function etDay(iso) {
    try { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso)); }
    catch (e) { return String(iso).slice(0, 10); }
  }
  function tsParse(d, tid) {
    var out = [];
    ((d && d.events) || []).forEach(function (e) {
      var st = e.seasonType && (e.seasonType.id != null ? e.seasonType.id : e.seasonType.type);
      if (st != null && String(st) === "1") return;
      var comp = (e.competitions || [])[0] || {}, cs = comp.competitors || [], me = null, op = null;
      cs.forEach(function (c) { if (c.team && String(c.team.id) === String(tid)) me = c; else op = c; });
      var dt = e.date || comp.date;
      if (!dt || !me) return;
      out.push({ d: etDay(dt), h: me.homeAway === "home" ? 1 : 0, o: (op && op.team && (op.team.abbreviation || op.team.displayName)) || "?" });
    });
    out.sort(function (a, b) { return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
    return out;
  }
  function loadTs(force) {
    if (tsBusy) return tsBusy;
    if (!force && tsCache && Date.now() - tsCache.t < 86400000) { if (sheet === "tsch" && !eventId) paint(tsRows()); stamp(); return Promise.resolve(); }
    statusLeft.textContent = "Calculating…";
    var pl = playersAll ? Promise.resolve() : loadPlayers(false).catch(function () {});
    tsBusy = pl.then(function () {
      var teams = (teamsAll || []).filter(function (t) { return t.abbr; }), map = {}, bad = [];
      if (!teams.length) throw new Error("no team list");
      return Promise.all(teams.map(function (t) {
        return fetch(BASE + "teams/" + encodeURIComponent(t.id) + "/schedule?seasontype=2", { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(function (d) { map[t.id] = tsParse(d, t.id); })
          .catch(function () { bad.push(t.id); });
      })).then(function () {
        if (Object.keys(map).length) {
          tsCache = { t: Date.now(), map: map, bad: bad };
          try { localStorage.setItem(TS_KEY, JSON.stringify(tsCache)); } catch (e) {}
        } else throw new Error("could not load any team schedule");
      });
    }).catch(function (e) {
      if (!tsCache) tsCache = { t: Date.now(), map: {}, bad: [], err: e.message };
      else tsCache.err = e.message;
    }).then(function () { tsBusy = false; if (sheet === "tsch" && !eventId) paint(tsRows()); stamp(); });
    return tsBusy;
  }
  function openTs() {
    holdGame();
    sheet = "tsch";
    selR = 1; selC = 0;
    clearTimeout(timer);
    renderChrome();
    tsFillControls();
    paint(tsCache && !tsCache.err ? tsRows() : loadingRows());
    loadTs(!tsCache || tsCache.err || Date.now() - tsCache.t > 86400000);
  }
  function tsWeekList() {
    var today = etToday(), st = shiftDate(today, -((dowOf(today) - tsStart + 7) % 7)), w = [];
    for (var i = 0; i < tsWeeks; i++) w.push({ s: shiftDate(st, 7 * i), e: shiftDate(st, 7 * i + 6) });
    return { today: today, weeks: w };
  }
  function tsLabel(w) { return w.s.slice(5).replace("-", "/") + "–" + w.e.slice(5).replace("-", "/"); }
  function tsFillControls() {
    document.getElementById("tsStart").value = String(tsStart);
    document.getElementById("tsWeeks").value = String(tsWeeks);
  }
  function tsRows() {
    var rows = [];
    var teams = (teamsAll || []).filter(function (t) { return t.abbr; });
    var c = tsCache;
    var wk = tsWeekList(), today = wk.today, weeks = wk.weeks;
    var upd = c && c.t ? clock.format(new Date(c.t)) : "…";
    rows.push({ c: [{ t: "Team Schedule   |   Opponent for every day, a total after each week   |   Weeks start on " + ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][tsStart] + ", dates are US Eastern   |   Left = games from today (" + today.slice(5).replace("-", "/") + ") to the end of this week   |   Loaded " + upd + " (UTC+8)", span: 12, cls: "bold" }] });
    if (c && c.err) rows.push({ c: [{ t: "Could not load the team schedules (" + c.err + "). Click Refresh All to retry.", span: 10, cls: "dim" }] });
    else if (c && c.bad && c.bad.length) rows.push({ c: [{ t: c.bad.length + " team(s) could not be loaded and show ?. Click Refresh All to retry.", span: 10, cls: "dim" }] });
    else rows.push({ c: [] });
    if (!c || !teams.length) { rows.push({ c: [{ t: "Loading…", span: 6, cls: "dim" }] }); return rows; }
    var mine = {}, tmOf = {};
    (playersAll || []).forEach(function (p) { tmOf[p.id] = p.teamId; });
    roster.concat(watch).forEach(function (p) { var t = p.id && tmOf[p.id]; if (t) mine[t] = 1; });
    var colDays = [];
    weeks.forEach(function (w, wi) { for (var i = 0; i < 7; i++) colDays.push({ d: shiftDate(w.s, i), wi: wi }); });
    var data = teams.map(function (t) {
      var list = c.map[t.id], ok = !!list;
      list = list || [];
      var byDay = {};
      list.forEach(function (g) { byDay[g.d] = g; });
      var o = { t: t, ok: ok, mine: !!mine[t.id], days: [], w: weeks.map(function () { return ok ? 0 : NaN; }) };
      colDays.forEach(function (cd) {
        var g = byDay[cd.d] || null, prev = byDay[shiftDate(cd.d, -1)];
        o.days.push({ d: cd.d, g: g, b2b: !!(g && prev) });
        if (g && ok) o.w[cd.wi]++;
      });
      o.left = ok ? list.filter(function (g) { return g.d >= today && g.d <= weeks[0].e; }).length : NaN;
      o.sum = ok ? o.left + o.w.slice(1).reduce(function (a, b) { return a + b; }, 0) : NaN;
      return o;
    });
    var k = sortTs.k, dir = sortTs.d;
    function keyVal(o) {
      if (k === "LEFT") return o.left;
      if (k === "SUM") return o.sum;
      if (k && k.charAt(0) === "W") return o.w[Number(k.slice(1))];
      if (k && k.charAt(0) === "D") { var x = o.days[Number(k.slice(1))]; return x && x.g ? 1 : 0; }
      return NaN;
    }
    if (k === "TEAM" || k === "NAME") data.sort(function (a, b) { return cmp(k === "TEAM" ? a.t.abbr : a.t.name, k === "TEAM" ? b.t.abbr : b.t.name, dir, false); });
    else if (k) data.sort(function (a, b) { return cmp(keyVal(a), keyVal(b), dir, true) || a.t.abbr.localeCompare(b.t.abbr); });
    else data.sort(function (a, b) { return a.t.abbr.localeCompare(b.t.abbr); });
    function hl(vals) {
      var v = vals.filter(function (x) { return !isNaN(x); }), mx = Math.max.apply(null, v), mn = Math.min.apply(null, v);
      return function (x) { return mx === mn || isNaN(x) ? "" : (x === mx ? " tsmax" : (x === mn ? " tsmin" : "")); };
    }
    var head = [hdrCell("Team", "hdr num", "ts|TEAM", k === "TEAM", dir), hdrCell("Name", "hdr stat", "ts|NAME", k === "NAME", dir), hdrCell("Left", "hdr num", "ts|LEFT", k === "LEFT", dir)];
    var colIdx = 0;
    weeks.forEach(function (w, wi) {
      for (var i = 0; i < 7; i++) {
        var dd = shiftDate(w.s, i);
        head.push(hdrCell(wdName[dowOf(dd)] + " " + dd.slice(5).replace("-", "/"), "hdr num", "ts|D" + colIdx, k === "D" + colIdx, dir));
        colIdx++;
      }
      head.push(hdrCell("Wk " + tsLabel(w), "hdr num wtot", "ts|W" + wi, k === "W" + wi, dir));
    });
    head.push(hdrCell("Total", "hdr num", "ts|SUM", k === "SUM", dir));
    rows.push({ c: head });
    var hLeft = hl(data.map(function (o) { return o.left; })), hSum = hl(data.map(function (o) { return o.sum; }));
    var hW = weeks.map(function (w, i) { return hl(data.map(function (o) { return o.w[i]; })); });
    var perDay = colDays.map(function () { return 0; });
    function num(v, cls) { return { t: isNaN(v) ? "?" : String(v), cls: "num" + (cls || "") }; }
    data.forEach(function (o) {
      var r = [{ t: o.t.abbr, cls: "num bold" + (o.mine ? " mine" : "") }, { t: o.t.name, cls: "stat" + (o.mine ? " mine" : "") }, num(o.left, hLeft(o.left) + " bold")];
      var di = 0;
      weeks.forEach(function (w, wi) {
        for (var i = 0; i < 7; i++, di++) {
          var x = o.days[di];
          if (x.g) perDay[di]++;
          r.push({ t: !o.ok ? "?" : (x.g ? (x.g.h ? "vs " : "@ ") + x.g.o : ""), cls: "num" + (x.b2b ? " b2b" : "") + (x.d < today ? " past" : "") });
        }
        r.push(num(o.w[wi], " wtot" + hW[wi](o.w[wi])));
      });
      r.push(num(o.sum, hSum(o.sum) + " bold"));
      rows.push({ c: r });
    });
    var fr = [{ t: "", cls: "num" }, { t: "Teams playing", cls: "stat bold" }, { t: "", cls: "num" }];
    var di2 = 0;
    weeks.forEach(function () {
      var tot = 0;
      for (var i = 0; i < 7; i++, di2++) { fr.push({ t: String(perDay[di2]), cls: "num bold" }); tot += perDay[di2]; }
      fr.push({ t: String(tot), cls: "num wtot" });
    });
    fr.push({ t: "", cls: "num" });
    rows.push({ c: fr });
    rows.push({ c: [{ t: "Orange = back-to-back (the team also played the day before). Grey = day already played. Green and red in the Wk columns = most and fewest games that week.", span: 10, cls: "dim" }] });
    return rows;
  }
  (function () {
    document.getElementById("tsStart").addEventListener("change", function (e) { var v = Number(e.target.value); tsStart = isNaN(v) ? 1 : v; sortTs = { k: null, d: -1 }; paint(tsRows()); });
    document.getElementById("tsWeeks").addEventListener("change", function (e) { tsWeeks = Number(e.target.value) || 6; sortTs = { k: null, d: -1 }; paint(tsRows()); });
  })();
  document.getElementById("navPick").addEventListener("click", function () { selR = 1; selC = 0; openPick(); });
  document.getElementById("navMine").addEventListener("click", function () { selR = 1; selC = 0; openMine(); });
  var wasNarrow = isNarrow(), resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (isNarrow() !== wasNarrow) { wasNarrow = isNarrow(); repaintCurrent(); } }, 300);
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && sheet !== "stats") refresh(); });

  try { applySettings(JSON.parse(localStorage.getItem(SET_KEY) || "null")); } catch (e) {}
  var startSheet = lastMainSheet;
  settingsReady = true;
  syncControls();
  renderChrome();
  paint(loadingRows());
  loadList();
  (function () {
    var m = startSheet;
    if (m === "pick") openPick();
    else if (m === "mine") openMine();
    else if (m === "sched") openSched();
    else if (m === "news") openNews();
    else if (m === "inj") openInj();
    else if (m === "stats") openStats();
    else if (m === "log") { sheet = "log"; renderChrome(); paint(logRows()); }
  })();
})();
</script>
